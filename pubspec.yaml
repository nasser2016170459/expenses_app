name: inovola
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.6
  ansicolor: ^2.0.1
  http: ^1.2.1
  http_interceptor: ^2.0.0
  json_serializable: ^6.5.4
  json_annotation: ^4.7.0
  intl: ^0.18.1
  flutter_svg: ^2.0.7
  shimmer: ^3.0.0
  file_picker: ^7.1.0
  flutter_bloc: ^9.1.1
  sqflite: ^2.3.3
  go_router: ^14.6.2
  uuid: ^4.5.1
  path: ^1.8.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.1.11

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
